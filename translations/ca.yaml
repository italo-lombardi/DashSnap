configuration:
  base_url:
    name: HA Base URL
    description: >-
      URL de la vostra instància de Home Assistant, tal com és accessible des de
      dins del contenidor de DashSnap.
      Exemples: http://homeassistant.local:8123, http://192.168.1.10:8123,
      o el vostre URL de Nabu Casa https://xxxx.ui.nabu.casa.
      Deixeu-ho buit si feu servir targets_json per a una configuració de múltiples destinacions.
  token:
    name: Token d'accés de llarga durada
    description: >-
      Un token d'accés de llarga durada de Home Assistant.
      Creeu-ne un a HA → Perfil (part inferior esquerra) → Tokens d'accés de llarga durada → Crea un token.
      Deixeu-ho buit si feu servir targets_json.
  targets_json:
    name: Configuració de múltiples destinacions (JSON)
    description: >-
      Opcional. Definiu múltiples destinacions (HA + Grafana + pàgines públiques) com una matriu JSON.
      Si s'estableix, base_url i token de dalt s'ignoren.
      Exemple: [{"name":"ha","base_url":"http://192.168.1.10:8123","auth":{"strategy":"ha_token","token":"eyJ..."}},
      {"name":"grafana","base_url":"https://grafana.example.com","auth":{"strategy":"http_header","headers":{"Authorization":"Bearer glsa_xxx"}}}]
      Estratègies admeses: ha_token, http_header, none.
