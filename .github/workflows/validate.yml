name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests with coverage
        run: pytest tests/ --cov=record --cov-branch --cov-report=term-missing -q

  smoke:
    name: Smoke (real browser)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start DashSnap container
        # The recordings smoke drives the live HTTP endpoints; the container
        # image bundles Chromium so its /record works. No options.json needed —
        # the config loader falls back to the built-in `public` target.
        run: |
          echo '{}' > options.json   # compose bind-mounts this file; absent → Docker makes a dir
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8099/health >/dev/null || { docker compose logs; exit 1; }
      - name: Run smoke test
        run: pytest -m smoke --no-cov -q
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop container
        if: always()
        run: docker compose down

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dashsnap:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
